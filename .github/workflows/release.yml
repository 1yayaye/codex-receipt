name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/codex-receipt" package/codex-receipt
          chmod +x package/codex-receipt
          tar -czf "dist/codex-receipt-${{ matrix.target }}.tar.gz" -C package codex-receipt
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codex-receipt.exe" "package/codex-receipt.exe"
          Compress-Archive -Path "package/codex-receipt.exe" -DestinationPath "dist/codex-receipt-${{ matrix.target }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: codex-receipt-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum codex-receipt-* > SHA256SUMS.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          codex-receipt release assets.

          Download the archive for your platform and verify it with SHA256SUMS.txt.
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md --verify-tag
            gh release upload "$TAG_NAME" dist/* --clobber
          fi
